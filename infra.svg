<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a24"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c77dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c77dff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b1d73"/>
      <stop offset="1" stop-color="#7b2fb0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="320" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#c77dff">
    <circle cx="320" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="70" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="35" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="60" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="30" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="25" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ground conduit -->
  <line x1="150" y1="262" x2="820" y2="262" stroke="#30363d" stroke-width="3"/>
  <line x1="150" y1="262" x2="820" y2="262" stroke="#9d4edd" stroke-width="1" stroke-dasharray="2 10" opacity="0.5"/>

  <!-- ===== SATELLITE ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="5s" repeatCount="indefinite"/>
    <!-- solar panels -->
    <rect x="108" y="60" width="34" height="16" fill="url(#panel)" stroke="#9d4edd"/>
    <line x1="119" y1="60" x2="119" y2="76" stroke="#0d1117"/>
    <line x1="130" y1="60" x2="130" y2="76" stroke="#0d1117"/>
    <rect x="178" y="60" width="34" height="16" fill="url(#panel)" stroke="#9d4edd"/>
    <line x1="189" y1="60" x2="189" y2="76" stroke="#0d1117"/>
    <line x1="200" y1="60" x2="200" y2="76" stroke="#0d1117"/>
    <!-- body -->
    <rect x="145" y="56" width="30" height="24" rx="3" fill="#161b22" stroke="#c77dff" stroke-width="1.5"/>
    <!-- dish -->
    <ellipse cx="160" cy="84" rx="9" ry="4" fill="#c77dff"/>
    <!-- blinking beacon -->
    <circle cx="160" cy="52" r="2.4" fill="#ff5f56"><animate attributeName="opacity" values="1;0.1;1" dur="1s" repeatCount="indefinite"/></circle>
    <!-- signal ping -->
    <circle cx="160" cy="84" r="4" fill="none" stroke="#c77dff" stroke-width="1.5">
      <animate attributeName="r" values="4;26;4" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- beam to house -->
  <polygon points="152,86 168,86 212,196 178,196" fill="url(#beam)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.6s" repeatCount="indefinite"/>
  </polygon>

  <!-- data packets down the beam -->
  <g fill="#ffffff">
    <circle r="3"><animateMotion path="M160,88 L195,196" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle r="2.4" fill="#c77dff"><animateMotion path="M160,88 L195,196" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle r="2.4" fill="#c77dff"><animateMotion path="M160,88 L195,196" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== HOUSE ===== -->
  <g>
    <!-- receiver antenna -->
    <line x1="195" y1="150" x2="195" y2="168" stroke="#c77dff" stroke-width="2"/>
    <path d="M186,150 Q195,140 204,150" fill="none" stroke="#c77dff" stroke-width="2"/>
    <!-- roof -->
    <polygon points="156,172 196,146 236,172" fill="#9d4edd"/>
    <!-- body -->
    <rect x="162" y="172" width="68" height="62" fill="#161b22" stroke="#9d4edd" stroke-width="2"/>
    <!-- door -->
    <rect x="186" y="204" width="20" height="30" fill="#0d1117" stroke="#c77dff"/>
    <!-- windows (lit) -->
    <rect x="168" y="182" width="15" height="13" fill="#c77dff"><animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="210" y="182" width="15" height="13" fill="#c77dff"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></rect>
  </g>

  <!-- ===== LAPTOP ===== -->
  <g>
    <!-- screen -->
    <rect x="404" y="206" width="64" height="42" rx="3" fill="#0d1117" stroke="#9d4edd" stroke-width="2"/>
    <!-- screen glow -->
    <rect x="404" y="206" width="64" height="42" rx="3" fill="#c77dff" opacity="0.08"><animate attributeName="opacity" values="0.04;0.16;0.04" dur="2.4s" repeatCount="indefinite"/></rect>
    <!-- code bars -->
    <rect x="412" y="214" width="26" height="4" fill="#c77dff"><animate attributeName="width" values="26;40;26" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="412" y="222" width="40" height="4" fill="#9d4edd"><animate attributeName="width" values="40;20;40" dur="2.3s" repeatCount="indefinite"/></rect>
    <rect x="412" y="230" width="18" height="4" fill="#27c93f"><animate attributeName="width" values="18;34;18" dur="1.8s" repeatCount="indefinite"/></rect>
    <!-- base -->
    <polygon points="392,248 480,248 494,258 378,258" fill="#161b22" stroke="#9d4edd" stroke-width="1.5"/>
  </g>

  <!-- packets house -> laptop -->
  <g fill="#c77dff">
    <circle r="3"><animateMotion path="M234,262 L404,262" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M234,262 L404,262" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- packets laptop -> servers -->
  <g fill="#27c93f">
    <circle r="3"><animateMotion path="M494,262 L700,262" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M494,262 L700,262" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M494,262 L700,262" dur="2.6s" begin="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== SERVER RACK ===== -->
  <g>
    <rect x="700" y="150" width="90" height="112" rx="5" fill="#161b22" stroke="#9d4edd" stroke-width="2"/>
    <!-- units -->
    <g>
      <rect x="708" y="158" width="74" height="16" rx="2" fill="#0d1117" stroke="#30363d"/>
      <circle cx="770" cy="166" r="2.4" fill="#27c93f"><animate attributeName="opacity" values="1;0.1;1" dur="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="762" cy="166" r="2.4" fill="#c77dff"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/></circle>
      <rect x="714" y="164" width="30" height="4" fill="#21262d"/>
    </g>
    <g>
      <rect x="708" y="178" width="74" height="16" rx="2" fill="#0d1117" stroke="#30363d"/>
      <circle cx="770" cy="186" r="2.4" fill="#27c93f"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="762" cy="186" r="2.4" fill="#c77dff"><animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/></circle>
      <rect x="714" y="184" width="30" height="4" fill="#21262d"/>
    </g>
    <g>
      <rect x="708" y="198" width="74" height="16" rx="2" fill="#0d1117" stroke="#30363d"/>
      <circle cx="770" cy="206" r="2.4" fill="#27c93f"><animate attributeName="opacity" values="1;0.1;1" dur="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="762" cy="206" r="2.4" fill="#c77dff"><animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/></circle>
      <rect x="714" y="204" width="30" height="4" fill="#21262d"/>
    </g>
    <g>
      <rect x="708" y="218" width="74" height="16" rx="2" fill="#0d1117" stroke="#30363d"/>
      <circle cx="770" cy="226" r="2.4" fill="#27c93f"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.95s" repeatCount="indefinite"/></circle>
      <circle cx="762" cy="226" r="2.4" fill="#c77dff"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
      <rect x="714" y="224" width="30" height="4" fill="#21262d"/>
    </g>
    <g>
      <rect x="708" y="238" width="74" height="16" rx="2" fill="#0d1117" stroke="#30363d"/>
      <circle cx="770" cy="246" r="2.4" fill="#27c93f"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="762" cy="246" r="2.4" fill="#c77dff"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.85s" repeatCount="indefinite"/></circle>
      <rect x="714" y="244" width="30" height="4" fill="#21262d"/>
    </g>
    <!-- incoming ping -->
    <circle cx="745" cy="262" r="4" fill="none" stroke="#27c93f" stroke-width="1.5">
      <animate attributeName="r" values="4;16;4" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- caption -->
  <text x="450" y="298" fill="#8b949e" font-size="13" letter-spacing="3" text-anchor="middle">SATELLITE  ·  HOME  ·  LAPTOP  ·  SERVER FARM</text>
  <text x="450" y="314" fill="#9d4edd" font-size="11" letter-spacing="2" text-anchor="middle">NEXUS FLOW — EXTERNAL TECHNOLOGY PARTNERS</text>
</svg>
