name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: juancamp7777
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Bogota
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: |
            body { background: #0d1117 !important; color: #c9d1d9 !important; }
            .field, .value, .text, text, tspan { color: #c9d1d9 !important; fill: #c9d1d9 !important; }
            rect.background, .background { fill: #0d1117 !important; }
            a, h2, h2 * { color: #c77dff !important; fill: #c77dff !important; }
            h2 { animation: glowPulse 3s ease-in-out infinite !important; }
            @keyframes glowPulse {
              0%, 100% { filter: drop-shadow(0 0 0 rgba(199,125,255,0)); }
              50% { filter: drop-shadow(0 0 9px rgba(199,125,255,0.85)); }
            }
